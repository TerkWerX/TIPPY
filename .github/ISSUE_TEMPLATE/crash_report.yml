name: Crash report
description: Report an unclean Tippy exit using a redacted recovery report
title: "[Crash]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        On Tippy's recovery screen, choose **Prepare crash report**. Review the local JSON and attach it below. Tippy never uploads reports automatically and never requires an API key.
  - type: input
    id: version
    attributes:
      label: Tippy version
      placeholder: 0.6.0
    validations:
      required: true
  - type: textarea
    id: activity
    attributes:
      label: What were you doing just before Tippy closed?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Can you reproduce it?
      description: List the shortest sequence that causes the problem, if known.
  - type: textarea
    id: report
    attributes:
      label: Tippy crash report
      description: Drag the reviewed tippy-crash JSON file here.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed the report before attaching it.
          required: true
