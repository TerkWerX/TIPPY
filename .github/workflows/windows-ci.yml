name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Tippy.slnx

      - name: Build
        run: dotnet build Tippy.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Tippy.slnx -c Release --no-build --logger "trx;LogFileName=tippy-tests.trx"

      - name: Publish Windows x64 app
        run: dotnet publish src/Tippy.App/Tippy.App.csproj -c Release -r win-x64 --self-contained true --no-restore -o dist/Tippy-win-x64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Tippy-win-x64
          path: dist/Tippy-win-x64/
          if-no-files-found: error
