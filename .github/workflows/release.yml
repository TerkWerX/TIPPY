name: Windows Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Resolve release version
        shell: pwsh
        run: |
          $releaseVersion = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart("v") }
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Release version must use major.minor.patch." }
          "TIPPY_RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - run: dotnet restore Tippy.slnx
      - run: dotnet test Tippy.slnx -c Release --no-restore
      - name: Publish self-contained Windows x64 app
        shell: pwsh
        run: dotnet publish src/Tippy.App/Tippy.App.csproj -c Release -r win-x64 --self-contained true --no-restore "-p:Version=$env:TIPPY_RELEASE_VERSION" -o dist/Tippy-win-x64

      - name: Prepare signing certificate
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "tippy-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          "TIPPY_SIGNING_CERTIFICATE=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign Tippy application binaries
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found." }
          @(Get-Item dist\Tippy-win-x64\Tippy.exe, dist\Tippy-win-x64\Tippy.dll) | ForEach-Object {
            & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:TIPPY_SIGNING_CERTIFICATE /p $env:SIGNING_CERTIFICATE_PASSWORD $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Signing failed for $($_.Name)." }
          }

      - name: Package portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\Tippy-win-x64\* -DestinationPath "dist\Tippy-$env:TIPPY_RELEASE_VERSION-win-x64.zip"

      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:TIPPY_RELEASE_VERSION" installer\Tippy.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }

      - name: Sign Windows installer
        if: env.SIGNING_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          $installer = Get-ChildItem dist\release\Tippy-*-Setup-x64.exe | Select-Object -First 1
          & $signTool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f $env:TIPPY_SIGNING_CERTIFICATE /p $env:SIGNING_CERTIFICATE_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed." }

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem "dist\Tippy-$env:TIPPY_RELEASE_VERSION-win-x64.zip") + @(Get-ChildItem dist\release\Tippy-*-Setup-x64.exe)
          $lines = $artifacts | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash)  $($_.Name)" }
          $lines | Set-Content dist\SHA256SUMS.txt

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "v$env:TIPPY_RELEASE_VERSION" } else { "${{ github.ref_name }}" }
          gh release create $tag "dist\Tippy-$env:TIPPY_RELEASE_VERSION-win-x64.zip" "dist\release\Tippy-$env:TIPPY_RELEASE_VERSION-Setup-x64.exe" dist\SHA256SUMS.txt --title "Tippy $tag" --generate-notes
